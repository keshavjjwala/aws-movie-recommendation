<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movie Picks</title>
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 20 30%22%3E%3Crect width=%2220%22 height=%2230%22 rx=%222%22 fill=%22%237FB4FF%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://image.tmdb.org">
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <header class="topbar">
    <a class="logo" href="#/">Movie Picks</a>
    <form class="search" role="search" id="search-form">
      <label for="search-input" class="visually-hidden">Search movies</label>
      <input id="search-input" type="search" placeholder="Search movies" autocomplete="off" enterkeyhint="search">
    </form>
    <nav class="account-nav" id="account-nav" aria-label="Your account"></nav>
  </header>

  <main id="view" tabindex="-1"></main>

  <footer class="footer">
    <p>Movie data and images from <a href="https://www.themoviedb.org/">TMDB</a>. This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
    <p>Ratings from the <a href="https://grouplens.org/datasets/movielens/">MovieLens</a> dataset by GroupLens Research.</p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
